<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile — BaanChangSom</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: var(--bg);
            padding-bottom: 90px;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 20px;
            background: linear-gradient(180deg, rgba(31,35,54,0.05) 0%, rgba(247,245,240,0) 100%);
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            object-fit: cover;
            margin-bottom: 12px;
            background: #e0e0e0;
        }

        .profile-name {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .profile-tier {
            font-size: 11px;
            font-weight: 700;
            color: #b8860b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(184, 134, 11, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* Customer Cards */
        .cust-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            margin: 0 20px 16px;
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }

        .cust-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 4px;
            background: var(--ink);
            border-radius: 4px 0 0 4px;
        }
        
        .cust-card.pending::before { background: #cc6600; }
        .cust-card.done::before { background: #2a7d4f; }

        .cust-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0,0,0,0.06);
        }

        .cust-service {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .cust-date {
            font-size: 12px;
            color: var(--ink-3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cust-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .cust-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-2);
        }

        .tabs {
            margin: 0 20px 20px;
            display: flex;
            background: rgba(0,0,0,0.04);
            padding: 4px;
            border-radius: 100px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border-radius: 100px;
            border: none;
            background: none;
            font-weight: 700;
            font-size: 12px;
            color: var(--ink-3);
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: var(--ink);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .view-panel {
            display: none;
            animation: fadeUp 0.4s ease forwards;
        }
        .view-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="global-loader" class="global-loader">
        <div class="spinner"></div>
        <div class="loader-text" data-i18n="loading">Loading...</div>
    </div>
    <!-- Navbar -->
    <div class="top-fade"></div>
    <a href="index.html" class="floating-logo">B.</a>
    <nav class="navbar">
        <div class="nav-links">
            <a href="booking.html" data-i18n="nav-booking">Booking</a>
            <a href="index.html#pricing" data-i18n="nav-pricing">Pricing</a>
        </div>
        <div class="nav-right">
            <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLang()">TH</button>
            <div class="nav-user-text">
                <div class="nav-user-label" data-i18n="nav-welcome">Welcome</div>
                <div class="nav-user-name" id="user-name">Guest</div>
            </div>
            <div class="nav-avatar">
                <img id="user-avatar" src="" alt="" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span class="material-symbols-outlined" id="user-avatar-fallback" style="font-size:18px; color:var(--ink-3); margin:auto;">person</span>
            </div>
        </div>
    </nav>

    <!-- Profile Header -->
    <div class="profile-header anim-1">
        <img src="" alt="" id="prof-img" class="profile-avatar" style="display:none;">
        <div class="profile-avatar" id="prof-placeholder" style="display:flex; align-items:center; justify-content:center;">
            <span class="material-symbols-outlined" style="font-size:32px; color:var(--ink-3);">person</span>
        </div>
        <div class="profile-name" id="prof-name" data-i18n="prof-guest">Guest User</div>
        <div class="profile-tier" data-i18n="prof-tier">Member</div>
    </div>

    <!-- Tabs -->
    <div class="tabs anim-2">
        <button class="tab-btn active" onclick="switchTab(this, 'upcoming')" data-i18n="prof-tab-upcoming">Upcoming</button>
        <button class="tab-btn" onclick="switchTab(this, 'history')" data-i18n="prof-tab-history">History</button>
    </div>

    <!-- Upcoming View -->
    <div id="upcoming" class="view-panel active anim-3">
        <!-- Empty State -->
        <div style="text-align:center; padding:40px 20px; color:var(--ink-3); font-size:13px; font-style:italic;">
            <span class="material-symbols-outlined" style="font-size:36px; display:block; margin-bottom:8px; color:var(--ink-3);">event_busy</span>
            <span data-i18n="prof-no-upcoming">No upcoming appointments</span>
        </div>
    </div>

    <!-- History View -->
    <div id="history" class="view-panel anim-3">
        <!-- Empty State -->
        <div style="text-align:center; padding:40px 20px; color:var(--ink-3); font-size:13px; font-style:italic;">
            <span class="material-symbols-outlined" style="font-size:36px; display:block; margin-bottom:8px; color:var(--ink-3);">history</span>
            <span data-i18n="prof-no-history">No past appointments</span>
        </div>
    </div>


    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="bnav-item">
            <span class="material-symbols-outlined bnav-icon">home</span>
            <span data-i18n="bnav-home">Home</span>
        </a>
        <a href="booking.html" class="bnav-center">
            <span class="material-symbols-outlined" style="font-size:22px; font-variation-settings:'FILL' 1;">event_upcoming</span>
        </a>
        <a href="profile.html" class="bnav-item active" id="nav-dynamic-item">
            <span class="material-symbols-outlined bnav-icon" id="nav-dynamic-icon" style="font-variation-settings:'FILL' 1;">person</span>
            <span id="nav-dynamic-text" data-i18n="bnav-profile">Profile</span>
        </a>
    </nav>

    <script>
        if (localStorage.getItem('isAdmin') === 'true') {
            const dl = document.getElementById('nav-dynamic-item');
            if (dl) dl.href = 'admin.html';
            const di = document.getElementById('nav-dynamic-icon');
            if (di) { di.textContent = 'calendar_month'; di.style.fontVariationSettings = ''; }
            const dt = document.getElementById('nav-dynamic-text');
            if (dt) dt.setAttribute('data-i18n', 'bnav-schedule');
        }
    </script>

    <script src="config.js"></script>
    <script src="lang.js"></script>
    <script>
        let appointmentsData = [];

        async function initLiff() {
            try {
                await liff.init({ liffId: "2010947166-BLk9wNiz" });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    
                    // Profile Header
                    document.getElementById('prof-name').textContent = profile.displayName;
                    if(profile.pictureUrl) {
                        const profImg = document.getElementById('prof-img');
                        profImg.src = profile.pictureUrl;
                        profImg.style.display = 'block';
                        document.getElementById('prof-placeholder').style.display = 'none';
                    }
                    
                    // Navbar
                    document.getElementById('user-name').textContent = profile.displayName;
                    if(profile.pictureUrl) {
                        const navImg = document.getElementById('user-avatar');
                        navImg.src = profile.pictureUrl;
                        navImg.style.display = 'block';
                        document.getElementById('user-avatar-fallback').style.display = 'none';
                    }

                    // Authenticate with Backend
                    const token = liff.getAccessToken();
                    if (token) {
                        await fetch(`${window.API_BASE_URL}/v1/auth/line/verify`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken: token })
                        }).catch(err => console.error('Verify failed:', err));

                        // Check admin status to update navbar
                        const adminIdToken = liff.getAccessToken();
                        fetch(`${window.API_BASE_URL}/v1/admin/auth/line`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken: adminIdToken })
                        })
                        .then(res => {
                            const dynamicLink = document.getElementById('nav-dynamic-item');
                            const dynamicIcon = document.getElementById('nav-dynamic-icon');
                            const dynamicText = document.getElementById('nav-dynamic-text');
                            if (res.ok) {
                                if (dynamicLink) {
                                    dynamicLink.href = 'admin.html';
                                    dynamicLink.classList.remove('active');
                                }
                                localStorage.setItem('isAdmin', 'true');
                                if (dynamicLink) dynamicLink.href = 'admin.html';
                                if (dynamicIcon) { dynamicIcon.textContent = 'calendar_month'; dynamicIcon.style.fontVariationSettings = ''; }
                                if (dynamicText) dynamicText.setAttribute('data-i18n', 'bnav-schedule');
                            } else {
                                localStorage.removeItem('isAdmin');
                                if (dynamicLink) {
                                    dynamicLink.href = 'profile.html';
                                    dynamicLink.classList.add('active');
                                }
                                if (dynamicIcon) {
                                    dynamicIcon.textContent = 'person';
                                    dynamicIcon.style.fontVariationSettings = "'FILL' 1";
                                }
                                if (dynamicText) dynamicText.setAttribute('data-i18n', 'bnav-profile');
                            }
                            if (typeof window.applyLang === 'function') window.applyLang();
                        })
                        .catch(err => console.error('Admin check failed:', err));
 
                        // Fetch user's appointments from Backend
                        const apptRes = await fetch(`${window.API_BASE_URL}/v1/me/appointments`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (apptRes.ok) {
                            const resData = await apptRes.json();
                            appointmentsData = resData.data?.appointments || [];
                            renderAppointmentsList(appointmentsData);
                        }
                    }
                } else {
                    liff.login();
                }
            } catch(e) {
                console.error(e);
                if (e.message && (e.message.includes('revoked') || e.message.includes('expired'))) {
                    liff.logout();
                    window.location.reload();
                } else {
                    alert('LIFF Error: ' + e.message);
                }
            } finally {
                const loader = document.getElementById('global-loader');
                if (loader) loader.classList.add('hidden');
            }
        }
        initLiff();
        
        window.renderAppointments = function() {
            if (typeof renderAppointmentsList === 'function') {
                renderAppointmentsList(appointmentsData);
            }
        };

        function renderAppointmentsList(appointments) {
            const upcomingContainer = document.getElementById('upcoming');
            const historyContainer = document.getElementById('history');
            if (!upcomingContainer || !historyContainer) return;
            
            upcomingContainer.innerHTML = '';
            historyContainer.innerHTML = '';
            
            const upcomingAppointments = appointments.filter(a => a.status === 'CONFIRMED');
            const historyAppointments = appointments.filter(a => a.status !== 'CONFIRMED');
            
            const lang = localStorage.getItem('lang') || 'th';
            
            // Render Upcoming
            if (upcomingAppointments.length === 0) {
                upcomingContainer.innerHTML = `
                    <div style="text-align:center; padding:40px 20px; color:var(--ink-3); font-size:13px; font-style:italic;">
                        <span class="material-symbols-outlined" style="font-size:36px; display:block; margin-bottom:8px; color:var(--ink-3);">event_busy</span>
                        <span>${lang === 'en' ? 'No upcoming appointments' : 'ไม่มีคิวบริการที่กำลังจะมาถึง'}</span>
                    </div>
                `;
            } else {
                upcomingAppointments.forEach(appt => {
                    const card = document.createElement('div');
                    card.className = 'cust-card pending';
                    
                    const dateObj = new Date(appt.date);
                    const day = dateObj.getDate();
                    const monthsEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const standardMonthsTh = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                    const yr = dateObj.getFullYear();
                    const yrTh = yr + 543;
                    const dateText = lang === 'en' ? `${day} ${monthsEn[dateObj.getMonth()]} ${yr}` : `${day} ${standardMonthsTh[dateObj.getMonth()]} ${yrTh}`;
                    
                    const serviceName = appt.type === 'FITTING' ? (lang === 'en' ? 'Fitting Appointment' : 'วัดตัวตัดชุด') : (lang === 'en' ? 'Design Consultation' : 'ปรึกษาการออกแบบ');
                    
                    let notesText = appt.notes || '';
                    if (lang === 'en') {
                        notesText = notesText.replace(/บริการ:/g, 'Service:');
                        notesText = notesText.replace(/ผู้จอง:/g, 'Name:');
                        notesText = notesText.replace(/เบอร์โทร:/g, 'Phone:');
                        notesText = notesText.replace(/คนที่ (\d+):/g, 'Person $1:');
                    }
                    
                    card.innerHTML = `
                        <div class="cust-card-top">
                            <div>
                                <div class="cust-service">${serviceName}</div>
                                <div class="cust-date">
                                    <span class="material-symbols-outlined" style="font-size:14px;">event</span>
                                    <span>${dateText}</span>
                                </div>
                            </div>
                            <span class="badge badge-pending">${lang === 'en' ? 'Confirmed' : 'ยืนยันแล้ว'}</span>
                        </div>
                        <div class="cust-details">
                            <div class="cust-row">
                                <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
                                <span>${appt.startTime} - ${appt.endTime}</span>
                            </div>
                            <div class="cust-row">
                                <span class="material-symbols-outlined" style="font-size:16px;">group</span>
                                <span>${appt.partySize} ${lang === 'en' ? 'People' : 'ท่าน'}</span>
                            </div>
                            ${notesText ? `
                            <div class="cust-row" style="grid-column: span 2; margin-top:4px;">
                                <span class="material-symbols-outlined" style="font-size:16px;">notes</span>
                                <span style="font-size:11px; white-space: pre-wrap;">${notesText}</span>
                            </div>` : ''}
                            <div class="cust-row" style="grid-column: span 2; margin-top:8px;">
                                <span class="material-symbols-outlined" style="font-size:16px; color:#cc3333;">info</span>
                                <span style="font-size:10px; color:var(--ink-3);">${lang === 'en' ? 'To cancel or modify, please contact admin via LINE OA.' : 'หากต้องการแก้ไขหรือยกเลิกคิว กรุณาติดต่อแอดมินผ่าน LINE OA'}</span>
                            </div>
                        </div>
                    `;
                    upcomingContainer.appendChild(card);
                });
            }
            
            // Render History
            if (historyAppointments.length === 0) {
                historyContainer.innerHTML = `
                    <div style="text-align:center; padding:40px 20px; color:var(--ink-3); font-size:13px; font-style:italic;">
                        <span class="material-symbols-outlined" style="font-size:36px; display:block; margin-bottom:8px; color:var(--ink-3);">history</span>
                        <span>${lang === 'en' ? 'No past appointments' : 'ไม่มีประวัติการทำรายการ'}</span>
                    </div>
                `;
            } else {
                historyAppointments.forEach(appt => {
                    const card = document.createElement('div');
                    card.className = 'cust-card done';
                    
                    const dateObj = new Date(appt.date);
                    const day = dateObj.getDate();
                    const monthsEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const standardMonthsTh = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                    const yr = dateObj.getFullYear();
                    const yrTh = yr + 543;
                    const dateText = lang === 'en' ? `${day} ${monthsEn[dateObj.getMonth()]} ${yr}` : `${day} ${standardMonthsTh[dateObj.getMonth()]} ${yrTh}`;
                    
                    const serviceName = appt.type === 'FITTING' ? (lang === 'en' ? 'Fitting Appointment' : 'วัดตัวตัดชุด') : (lang === 'en' ? 'Design Consultation' : 'ปรึกษาการออกแบบ');
                    
                    let statusText = lang === 'en' ? 'Completed' : 'เสร็จสิ้น';
                    if (appt.status === 'CANCELLED') statusText = lang === 'en' ? 'Cancelled' : 'ยกเลิกแล้ว';
                    if (appt.status === 'NO_SHOW') statusText = lang === 'en' ? 'No Show' : 'ไม่มาแสดงตัว';
                    
                    let notesText = appt.notes || '';
                    if (lang === 'en') {
                        notesText = notesText.replace(/บริการ:/g, 'Service:');
                        notesText = notesText.replace(/ผู้จอง:/g, 'Name:');
                        notesText = notesText.replace(/เบอร์โทร:/g, 'Phone:');
                        notesText = notesText.replace(/คนที่ (\d+):/g, 'Person $1:');
                    }
                    
                    card.innerHTML = `
                        <div class="cust-card-top">
                            <div>
                                <div class="cust-service">${serviceName}</div>
                                <div class="cust-date">
                                    <span class="material-symbols-outlined" style="font-size:14px;">event</span>
                                    <span>${dateText}</span>
                                </div>
                            </div>
                            <span class="badge ${appt.status === 'CANCELLED' ? 'badge-cancelled' : 'badge-confirm'}">${statusText}</span>
                        </div>
                        <div class="cust-details">
                            <div class="cust-row">
                                <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
                                <span>${appt.startTime} - ${appt.endTime}</span>
                            </div>
                            <div class="cust-row">
                                <span class="material-symbols-outlined" style="font-size:16px;">group</span>
                                <span>${appt.partySize} ${lang === 'en' ? 'People' : 'ท่าน'}</span>
                            </div>
                            ${notesText ? `
                            <div class="cust-row" style="grid-column: span 2; margin-top:4px;">
                                <span class="material-symbols-outlined" style="font-size:16px;">notes</span>
                                <span style="font-size:11px; white-space: pre-wrap;">${notesText}</span>
                            </div>` : ''}
                        </div>
                    `;
                    historyContainer.appendChild(card);
                });
            }
        }

        function switchTab(btn, panelId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(panelId).classList.add('active');
        }

        // Apply translations for custom dynamic strings in profile page
        function updateProfileTranslations() {
            const lang = localStorage.getItem('lang') || 'th';
            document.querySelectorAll('.translate-me').forEach(el => {
                if(el.getAttribute(`data-${lang}`)) {
                    el.textContent = el.getAttribute(`data-${lang}`);
                }
            });
            if (appointmentsData.length > 0) {
                renderAppointmentsList(appointmentsData);
            }
        }
        
        // Listen to applyLang hook
        function updateAdminTranslations() {
            updateProfileTranslations();
        }
        
        // Initial setup
        updateProfileTranslations();


    </script>
</body>
</html>
